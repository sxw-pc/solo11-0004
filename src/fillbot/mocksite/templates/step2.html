{% extends "base.html" %}
{% block content %}
<h1>第二步：能耗数据</h1>
{% if errors %}<div class="error"><ul>{% for field, items in errors.items() %}{% for item in items %}<li>{{ field }}: {{ item }}</li>{% endfor %}{% endfor %}</ul></div>{% endif %}
<form id="step2-form" method="post" action="/report/step2">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label for="electricity">用电量（千瓦时）</label><input id="electricity" name="electricity" type="number" step="0.01" value="{{ values.electricity }}" required>
<label for="water">用水量（吨）</label><input id="water" name="water" type="number" step="0.01" value="{{ values.water }}" required>
<label for="gas">用气量（立方米）</label><input id="gas" name="gas" type="number" step="0.01" value="{{ values.gas }}" required>
<button type="submit">下一步</button>
</form>
{% endblock %}
